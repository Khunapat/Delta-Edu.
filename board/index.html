<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B5C03">
<title>δelta Edu. Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #0B5C03; --green: #2E7D1E; --accent: #C8E88D; --cream: #FDFCF4; --panel: #E8F0E4;
  --line: #D9E3D3; --ink: #1F2A1D; --muted: #5F6B5B; --gold: #D4A017; --both: #3E7CB1;
  --todo: #8E9A8B; --doing: #0B5C03; --blocked: #C8462F; --done: #2F8F3A; --warn: #B7791F;
  --card: #FFFFFF; --radius: 14px; --shadow: 0 1px 2px rgba(31,42,29,.05), 0 4px 14px rgba(31,42,29,.05);
  --font: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--cream); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -.01em; }

/* ---------- shell ---------- */
.app { min-height: 100vh; }
.side { background: var(--primary); color: var(--cream); }
.logo { color: var(--cream); display: flex; align-items: center; gap: 8px; height: 28px; font-weight: 800; letter-spacing: .02em; }
.logo svg { height: 20px; width: auto; display: block; }
.logo b { font-size: 17px; }
.nav { display: flex; gap: 4px; }
.nav button { border: 0; background: transparent; color: rgba(253,252,244,.78); display: flex; align-items: center; gap: 10px; border-radius: 10px; font-weight: 700; white-space: nowrap; }
.nav button svg { width: 18px; height: 18px; flex: none; }
.nav button.on { background: rgba(200,232,141,.16); color: var(--accent); }
.nav button:hover { color: var(--cream); }
.side-foot { font-size: 12px; color: rgba(253,252,244,.6); }
.main { padding: 18px 16px 90px; max-width: 1180px; min-width: 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: 24px; }
.page-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

@media (max-width: 899px) {
  .side { position: sticky; top: 0; z-index: 20; padding: 10px 0 0; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  .side .logo { padding: 0 16px; }
  .nav { overflow-x: auto; padding: 8px 12px 10px; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav button { padding: 7px 12px; font-size: 14px; }
  .nav button svg { width: 16px; height: 16px; }
  .side-foot { display: none; }
}
@media (min-width: 900px) {
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); }
  .side { position: sticky; top: 0; height: 100vh; padding: 22px 14px; display: flex; flex-direction: column; gap: 22px; }
  .side .logo { padding: 0 10px; }
  .nav { flex-direction: column; }
  .nav button { padding: 10px 12px; width: 100%; text-align: left; }
  .side-foot { margin-top: auto; padding: 0 10px; }
  .main { padding: 28px 32px 60px; }
  .page-head h1 { font-size: 28px; }
}

/* ---------- pieces ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { font-size: 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h2 small { font-weight: 600; color: var(--muted); font-size: 13px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .g2 { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
@media (min-width: 900px) { .kpis { grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; } }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); text-align: left; }
.kpi .n { font-size: 28px; font-weight: 800; line-height: 1.1; }
.kpi .l { color: var(--muted); font-size: 13px; font-weight: 600; }
.kpi.warn .n { color: var(--warn); } .kpi.bad .n { color: var(--blocked); }
.hero { background: var(--primary); color: var(--cream); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
.hero h1 { font-size: 22px; }
.hero p { margin: 4px 0 0; color: var(--accent); font-weight: 600; font-size: 14px; }

.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--green); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--cream); }
.btn.primary:hover { background: var(--green); }
.btn.danger { color: var(--blocked); }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: 13px; color: var(--muted); }
.chip.on { background: var(--primary); border-color: var(--primary); color: var(--cream); }
.pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 800; color: #fff; background: var(--muted); white-space: nowrap; }
.pill.Uni { background: var(--primary); } .pill.LITE { background: var(--gold); color: #2A2000; } .pill.Both { background: var(--both); }
.pill.area { background: var(--panel); color: var(--primary); }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--todo)); }
.empty { color: var(--muted); font-size: 14px; padding: 14px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; background: rgba(232,240,228,.4); }

.list { display: flex; flex-direction: column; gap: 8px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; min-width: 0; }
button.item:hover { border-color: var(--green); }
.item .body { flex: 1; min-width: 0; }
.item .t { font-weight: 700; overflow-wrap: anywhere; }
.item .meta { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.item .meta .late { color: var(--warn); font-weight: 800; }
.item.late { border-left: 4px solid var(--warn); }
.item.blk { border-left: 4px solid var(--blocked); }
.bar-stack { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--panel); }
.bar-stack span { display: block; height: 100%; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }

.kanban { display: grid; gap: 14px; grid-template-columns: minmax(0,1fr); }
@media (min-width: 900px) { .kanban { grid-template-columns: repeat(4, minmax(0,1fr)); align-items: start; } .kanban.k3 { grid-template-columns: repeat(3, minmax(0,1fr)); } }
.col { background: var(--panel); border-radius: var(--radius); padding: 10px; min-width: 0; }
.col h3 { font-size: 14px; display: flex; align-items: center; gap: 8px; margin: 2px 4px 10px; }
.col h3 .st { font-size: 14px; color: var(--ink); font-weight: 800; }
.col h3 .count { color: var(--muted); font-weight: 700; }
.col .none { color: var(--muted); font-size: 13px; padding: 4px 6px 6px; }

.day-h { font-weight: 800; font-size: 13px; color: var(--green); text-transform: uppercase; letter-spacing: .04em; margin: 16px 2px 8px; }
.day-h:first-child { margin-top: 0; }
.time { font-weight: 800; color: var(--primary); min-width: 46px; font-size: 14px; }
.crow { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; min-width: 0; }
.crow > .item { flex: 1; }
details.past summary { cursor: pointer; font-weight: 700; color: var(--muted); margin: 14px 2px 8px; }

.tl { position: relative; padding-left: 22px; }
.tl::before { content: ""; position: absolute; left: 7px; top: 4px; bottom: 4px; width: 2px; background: var(--line); }
.tl .month { font-weight: 800; color: var(--green); margin: 14px 0 8px; font-size: 14px; }
.tl .month:first-child { margin-top: 0; }
.tl .item { position: relative; margin-bottom: 8px; }
.tl .item::before { content: ""; position: absolute; left: -21px; top: 15px; width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--todo)); border: 2px solid #fff; box-sizing: border-box; }

.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { padding: 7px 6px; text-align: left; border-bottom: 1px solid var(--line); }
.tbl th { color: var(--muted); font-size: 12px; font-weight: 700; }
.tbl .r { text-align: right; }
.tbl tfoot td { font-weight: 800; border-bottom: 0; }
.tbl-wrap { overflow-x: auto; }
.ladder-row { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto; gap: 8px; align-items: end; margin-bottom: 8px; }
.note-box { background: var(--panel); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.provisional { display: inline-block; background: #FFF6DD; color: #7A5410; border: 1px solid #F0DDA5; border-radius: 8px; padding: 4px 10px; font-size: 12.5px; font-weight: 700; margin-bottom: 12px; }
.big { font-size: 22px; font-weight: 800; }
.sum-tiles { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin: 12px 0; }
.sum-tiles > div { background: var(--panel); border-radius: 10px; padding: 10px; min-width: 0; }
.sum-tiles .l { font-size: 12px; color: var(--muted); font-weight: 700; }
.sum-tiles .big { font-size: 18px; overflow-wrap: anywhere; }

.qbar { margin: 6px 0; }
.qbar .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.qbar .lab span:first-child { overflow-wrap: anywhere; }
.qbar .track { height: 8px; background: var(--panel); border-radius: 999px; overflow: hidden; margin-top: 3px; }
.qbar .fill { height: 100%; background: var(--green); border-radius: 999px; }
.quote { background: var(--panel); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; margin: 6px 0; overflow-wrap: anywhere; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- forms / sheet ---------- */
label.f { display: block; margin-bottom: 12px; min-width: 0; }
label.f > span { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
input[type=text], input[type=date], input[type=time], input[type=number], input[type=url], select, textarea {
  width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 11px; font-size: 16px; min-width: 0; min-height: 42px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); border-color: var(--green); }
textarea { min-height: 90px; resize: vertical; }
select.mini { width: auto; min-height: 0; padding: 4px 10px; font-size: 13px; border-radius: 999px; font-weight: 700; color: var(--muted); }
.f2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 0 10px; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 700; margin-bottom: 12px; }
.check input { width: 18px; height: 18px; accent-color: var(--primary); }
.scrim { position: fixed; inset: 0; background: rgba(15,25,12,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--cream); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px 16px 0; box-shadow: 0 -6px 30px rgba(0,0,0,.2); }
@media (min-width: 900px) { .scrim { align-items: center; } .sheet { border-radius: 18px; padding: 22px 22px 0; } }
.sheet h2 { font-size: 19px; margin-bottom: 14px; overflow-wrap: anywhere; }
.sheet .actions { display: flex; gap: 8px; position: sticky; bottom: 0; background: var(--cream); padding: 12px 0 calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); margin-top: 4px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--cream); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.toast.err { background: var(--blocked); }
.loading { padding: 60px 16px; text-align: center; color: var(--muted); }
.fab { position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 30; border-radius: 999px; padding: 12px 18px; box-shadow: 0 6px 18px rgba(11,92,3,.35); }
@media (min-width: 900px) { .fab { position: static; box-shadow: none; padding: 8px 14px; border-radius: 10px; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><b>DELTA_EDU</b></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">Team board · syncs with the LINE bot</div>
  </aside>
  <main class="main" id="main"><div class="loading">Loading the board…</div></main>
</div>

<script>
'use strict';
// ---------- helpers ----------
// Build DOM safely: text always goes in as text nodes, never as HTML.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else if (k === 'selected') el.selected = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const ICONS = {
  home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
  tasks: 'M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2',
  classes: 'M3 8l9-4 9 4-9 4-9-4zm4 2v5c0 1.5 2.5 3 5 3s5-1.5 5-3v-5',
  decisions: 'M12 3v18M5 7h14l-3 5H8zM7 21h10',
  meetings: 'M4 5h16v11H8l-4 4z',
  timeline: 'M4 12h16M7 8v8M12 6v12M17 9v6',
  notes: 'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5',
  feedback: 'M4 20V10M10 20V4M16 20v-7M21 20H3',
};
function icon(name) {
  const NS = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(NS, 'svg');
  for (const [k, v] of Object.entries({ viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '2', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' })) s.setAttribute(k, v);
  const p = document.createElementNS(NS, 'path'); p.setAttribute('d', ICONS[name] || ''); s.append(p);
  return s;
}
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const isDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtDate(s, withDay) {
  if (!isDate(s)) return s || '';
  const d = new Date(s + 'T00:00:00');
  return (withDay ? DAYS[d.getDay()] + ' ' : '') + d.getDate() + ' ' + MONTHS[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
function dayLabel(s) {
  const t = today();
  if (s === t) return 'Today · ' + fmtDate(s);
  if (s === addDays(t, 1)) return 'Tomorrow · ' + fmtDate(s);
  if (s === addDays(t, -1)) return 'Yesterday · ' + fmtDate(s);
  return fmtDate(s, true);
}
const monthLabel = (s) => { const d = new Date(s + 'T00:00:00'); return MONTHS[d.getMonth()] + ' ' + d.getFullYear(); };
const fmtStamp = (s) => { const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }); };
const splitNames = (s) => String(s || '').split(/\s*,\s*/).map((x) => x.trim()).filter((x) => x && !/^unassigned$/i.test(x));
const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const fmtNum = (n, d = 0) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const stamp = () => new Date().toISOString();
const byStr = (f) => (a, b) => String(f(a) || '').localeCompare(String(f(b) || ''));

let toastTimer = null;
function toast(msg, err) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = h('div', { class: 'toast' + (err ? ' err' : ''), role: 'status' }, msg);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), err ? 4200 : 2200);
}
async function save(fn, okMsg) {
  try { await fn(); toast(okMsg || 'Saved'); return true; }
  catch (e) { console.warn(e); toast('Could not save: ' + ((e && e.message) || 'try again'), true); return false; }
}

// ---------- state ----------
const S = {
  db: null, me: '', page: 'home',
  tasks: {}, milestones: {}, classes: {}, decisions: {}, meetings: {}, notes: {}, members: {},
  pay: null, summary: null, rcfg: null,
  taskFilter: 'All', taskMine: false, classBrand: 'All', classTutor: 'All',
  calc: { src: 'manual', students: '', hours: '', price: '' }, ladderDraft: null,
};
const PAGES = [
  ['home', 'Home'], ['tasks', 'Tasks'], ['classes', 'Classes'], ['decisions', 'Decisions'],
  ['meetings', 'Meetings'], ['timeline', 'Timeline'], ['notes', 'Notes'], ['feedback', 'Feedback'],
];
const STATUS = { todo: 'To do', doing: 'Doing', blocked: 'Blocked', done: 'Done' };
const STATUS_C = { todo: 'var(--todo)', doing: 'var(--doing)', blocked: 'var(--blocked)', done: 'var(--done)' };
const PRIO = { high: 'High', med: 'Medium', low: 'Low' };
const BRANDS = ['Uni', 'LITE', 'Both'];
const AREAS = ['Ownership', 'Pay', 'Courses', 'Operations', 'Other'];
const list = (coll) => Object.entries(S[coll]).map(([id, d]) => Object.assign({}, d, { id }));

/** Team names for every people picker: the server's read-only members/ docs; tasks/classes only as a fallback. */
function people() {
  const set = new Set();
  for (const m of Object.values(S.members)) if (m && m.nickname) set.add(String(m.nickname).trim());
  if (!set.size) {
    for (const t of Object.values(S.tasks)) splitNames(t.owner).forEach((n) => set.add(n));
    for (const c of Object.values(S.classes)) if (c.tutor) set.add(String(c.tutor).trim());
    if (S.me) set.add(S.me);
  }
  return [...set].filter(Boolean).sort((a, b) => a.localeCompare(b));
}
function brandPill(b) {
  const v = String(b || '').trim() || 'General';
  return h('span', { class: 'pill' + (BRANDS.includes(v) ? ' ' + v : '') }, v);
}
const stDot = (s, label) => h('span', { class: 'st', style: '--c:' + (STATUS_C[s] || 'var(--todo)') }, label || STATUS[s] || s);
const isLate = (t) => t.status !== 'done' && isDate(t.due) && t.due < today();
const empty = (text) => h('div', { class: 'empty' }, text);

// ---------- sheet (form dialog) ----------
function closeSheet() { document.querySelectorAll('.scrim').forEach((s) => s.remove()); }
function openSheet(title, content, actions) {
  closeSheet();
  const scrim = h('div', { class: 'scrim', onclick: (e) => { if (e.target === scrim) closeSheet(); } },
    h('div', { class: 'sheet', role: 'dialog', 'aria-label': title }, h('h2', null, title), content, h('div', { class: 'actions' }, actions)));
  document.body.append(scrim);
  const first = scrim.querySelector('input,textarea,select');
  if (first && window.innerWidth >= 900) first.focus();
}
/** fields: [{ key, label, type, options, placeholder, half }] -> a sheet with Save / Cancel / Delete. */
function openForm({ title, fields, values = {}, onSave, onDelete, saveLabel }) {
  const get = {};
  const body = h('div');
  let rowBuf = null;
  for (const f of fields) {
    let input;
    const v = values[f.key] == null ? (f.def != null ? f.def : '') : values[f.key];
    if (f.type === 'check') {
      input = h('input', { type: 'checkbox', checked: !!v });
      get[f.key] = () => input.checked;
      body.append(h('label', { class: 'check' }, input, f.label));
      rowBuf = null;
      continue;
    }
    if (f.type === 'people') {

// ---------- Tutor pay ----------
function bands() {
  const b = (S.pay && Array.isArray(S.pay.bands)) ? S.pay.bands : [];
  return b.map((x) => ({ from: num(x.from), to: x.to == null || x.to === '' ? null : num(x.to), tutor: num(x.tutor) }))
    .filter((x) => x.from > 0).sort((a, b) => a.from - b.from);
}
/** Progressive split, like tax brackets: the students inside each band earn that band's tutor %. */
function splitPay(students, hours, price) {
  const rows = bands().map((b) => {
    const top = b.to == null ? Infinity : b.to;
    const n = Math.max(0, Math.min(students, top) - b.from + 1);
    const fees = n * hours * price;
    return { band: b, n, fees, tutor: fees * b.tutor / 100 };
  });
  const fees = students * hours * price;
  const tutor = rows.reduce((a, r) => a + r.tutor, 0);
  return { rows, fees, tutor, company: fees - tutor, uncovered: Math.max(0, students - rows.reduce((a, r) => a + r.n, 0)) };
}
function payCalculator() {
  const C = S.calc;
  const card = h('div', { class: 'card' }, h('h2', null, 'Tutor pay calculator'));
  card.append(h('div', { class: 'provisional' }, 'Provisional – follows the ladder your partners agreed'));
  const cls = list('classes').filter((c) => isDate(c.date) && c.status !== 'cancelled').sort(byStr((c) => c.date)).reverse();
  if (C.src.startsWith('class:') && !S.classes[C.src.slice(6)]) C.src = 'manual';
  const src = h('select', { 'aria-label': 'Which classes', onchange: (e) => {
    C.src = e.target.value;
    const c = C.src.startsWith('class:') && S.classes[C.src.slice(6)];
    if (c) { C.students = c.students; C.hours = c.hours; }
    render();
  } },
    h('option', { value: 'manual', selected: C.src === 'manual' }, 'Enter numbers by hand'),
    courses().length ? h('optgroup', { label: 'All classes of a course' }, courses().map((x) => h('option', { value: 'course:' + x, selected: C.src === 'course:' + x }, x))) : null,
    cls.length ? h('optgroup', { label: 'One class' }, cls.slice(0, 40).map((c) => h('option', { value: 'class:' + c.id, selected: C.src === 'class:' + c.id }, fmtDate(c.date) + ' · ' + c.course + (c.tutor ? ' · ' + c.tutor : '')))) : null);
  card.append(h('label', { class: 'f' }, h('span', null, 'Classes'), src));
  const inp = (key, label, step) => h('label', { class: 'f' }, h('span', null, label),
    h('input', { type: 'number', min: 0, step, value: C[key], placeholder: '0', oninput: (e) => { C[key] = e.target.value; drawResult(); } }));
  const isCourse = C.src.startsWith('course:');
  if (!isCourse) card.append(h('div', { class: 'f2' }, inp('students', 'Students', 1), inp('hours', 'Hours', 0.5)));
  card.append(inp('price', 'Price per student-hour', 1));
  const out = h('div');
  card.append(out);
  function drawResult() {
    out.replaceChildren();
    if (!bands().length) { out.append(empty('No pay ladder yet. Add the bands your partners agreed in the Pay ladder card.')); return; }
    const price = num(C.price);
    const sessions = isCourse
      ? cls.filter((c) => c.course === C.src.slice(7)).map((c) => ({ s: Math.round(num(c.students)), hr: num(c.hours) }))
      : [{ s: Math.round(num(C.students)), hr: num(C.hours) }];
    if (!price || !sessions.some((x) => x.s && x.hr)) { out.append(h('div', { class: 'muted small' }, 'Enter students, hours and a price to see the split.')); return; }
    const agg = { rows: bands().map((b) => ({ band: b, n: 0, tutor: 0 })), fees: 0, tutor: 0, company: 0, uncovered: 0 };
    for (const x of sessions) {

async function saveLadder() {
  const out = [];
  for (const b of S.ladderDraft) {
    if (b.from === '' && b.to === '' && b.tutor === '') continue;
    const from = Math.round(num(b.from)), to = b.to === '' ? null : Math.round(num(b.to)), tutor = num(b.tutor);
    if (from < 1 || (to != null && to < from) || b.tutor === '' || tutor < 0 || tutor > 100) { toast('Check the bands: From 1 or more, To not below From, Tutor % 0–100', true); return; }
    out.push({ from, to, tutor });
  }
  out.sort((a, b) => a.from - b.from);
  for (let i = 1; i < out.length; i++) {
    const prev = out[i - 1];
    if (prev.to == null || out[i].from <= prev.to) { toast('Bands overlap: each band must start after the one before ends', true); return; }
  }
  if (await save(() => S.db.doc('settings/pay').set({ bands: out, updated: stamp(), by: S.me || '' }), 'Ladder saved')) { S.ladderDraft = null; render(); }
}

  try { const user = await window.claude.use('user'); const me = user ? await user.me() : null; S.me = (me && me.name) || ''; } catch (_) {}
  S.db = db;
  const onErr = (e) => { if (e && e.code !== 'revoked') console.warn(e); };
  for (const coll of ['tasks', 'milestones', 'classes', 'decisions', 'meetings', 'notes', 'members']) {
    db.collection(coll).onSnapshot((snap) => {
      const next = {};
      snap.docs.forEach((d) => { next[d.id] = d.data() || {}; });
      S[coll] = next;
      queueRender();
    }, onErr);
  }
  const one = (path, key, after) => db.doc(path).onSnapshot((d) => { S[key] = d.exists ? (d.data() || {}) : null; if (after) after(); queueRender(); }, onErr);
  one('settings/pay', 'pay', () => { S.ladderDraft = null; });
  one('research/summary', 'summary');
  one('research/config', 'rcfg');
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
  render();
})();
</script>
</body>
</html>
