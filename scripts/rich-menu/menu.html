<!doctype html>
<!-- δelta Edu. menu bar, 2500 x 843. Render with: node scripts/rich-menu/render.mjs
     Grid matches areas() in src/richmenu.js: 3 columns x 2 rows, edge to edge, in the
     order of its buttons: My tasks | Today | Team / New task | Classes | Help (or Board).
     render.mjs puts the cream slab logo in the SLAB placeholder and swaps Help for the Board tile
     in menu-board.png. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=block" rel="stylesheet">
<style>
  :root { --dark:#0B5C03; --green:#2E7D1E; --light:#C8E88D; --cream:#FDFCF4; --soft:#E8F0E4; --ink:#1F2A1D; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2500px; height: 843px; overflow: hidden; }
  body { font-family: 'Nunito', 'Helvetica Neue', Arial, sans-serif; color: var(--dark); background: var(--cream); }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); width: 2500px; height: 843px; padding: 10px; }
  .cell { padding: 14px; }
  .tile {
    position: relative; height: 100%; border-radius: 44px; overflow: hidden;
    background: var(--soft); border: 4px solid #D6E6CF;
    display: flex; align-items: center; gap: 48px; padding: 0 60px;
  }
  .icon {
    position: relative; flex: none; width: 190px; height: 190px; border-radius: 52px;
    background: var(--dark); display: grid; place-items: center;
  }
  .icon svg { width: 112px; height: 112px; stroke: var(--cream); fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
  .label { font-weight: 900; font-size: 96px; line-height: 1; letter-spacing: -1px; white-space: nowrap; }

  /* hero tile: dark green, cream type, slab logo in the corner */
  .hero { background: var(--dark); border-color: var(--dark); color: var(--cream); }
  .hero .icon { background: var(--light); }
  .hero .icon svg { stroke: var(--dark); }
  .brand { position: absolute; bottom: 34px; right: 40px; width: 104px; line-height: 0; }
  .brand svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="grid">
  <!-- My tasks -->
  <div class="cell"><div class="tile hero">
    <span class="brand"><!--SLAB--></span>
    <div class="icon"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.6 1.6L8 4.8M3.5 12l1.6 1.6L8 10.8M3.5 18l1.6 1.6L8 16.8"/></svg></div>
    <div class="label">My tasks</div>
  </div></div>
  <!-- Today -->
  <div class="cell"><div class="tile">
    <div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M2.5 12h2M19.5 12h2M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></div>
    <div class="label">Today</div>
  </div></div>
  <!-- Team -->
  <div class="cell"><div class="tile">
    <div class="icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16.5 14.2c2.6.3 4.5 2.6 4.5 5.3"/></svg></div>
    <div class="label">Team</div>
  </div></div>
  <!-- New task -->
  <div class="cell"><div class="tile">
    <div class="icon"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M12 8v8M8 12h8"/></svg></div>
    <div class="label">New task</div>
  </div></div>
  <!-- Classes -->
  <div class="cell"><div class="tile">
    <div class="icon"><svg viewBox="0 0 24 24"><path d="M2.5 9L12 4.5 21.5 9 12 13.5z"/><path d="M6.5 11v4.5c0 1.6 2.5 3 5.5 3s5.5-1.4 5.5-3V11"/><path d="M21.5 9v5"/></svg></div>
    <div class="label">Classes</div>
  </div></div>
  <!-- Help (menu.png) / Board (menu-board.png) -->
  <div class="cell help-tile"><div class="tile">
    <div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.8"/><path d="M12 17.2h.01"/></svg></div>
    <div class="label">Help</div>
  </div></div>
</div>
<template id="board-tile">
  <div class="tile">
    <div class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="9" rx="2"/><rect x="13.5" y="3" width="7.5" height="5" rx="2"/><rect x="13.5" y="11" width="7.5" height="10" rx="2"/><rect x="3" y="15" width="7.5" height="6" rx="2"/></svg></div>
    <div class="label">Board</div>
  </div>
</template>
<script>
  if (location.hash === '#board') document.querySelector('.help-tile').replaceChildren(document.getElementById('board-tile').content.cloneNode(true));
</script>
</body>
</html>
