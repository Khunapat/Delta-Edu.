<!doctype html>
<!-- Norse menu bar, 2500 x 843. Render with: node scripts/rich-menu/render.mjs
     Grid matches areas() in src/richmenu.js: 3 columns x 2 rows, edge to edge. -->
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=Inter:wght@500;700;800&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0C1112; --panel: #141B1D; --panel2: #1A2326; --line: #232E31;
    --ink: #E7EFED; --muted: #8C9A98; --accent: #8FD9C6; --accent2: #5FBFA9;
    --accentSoft: #1C3631; --onAccent: #0C1715; --heroA: #9FE3D1; --heroB: #5FBFA9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2500px; height: 843px; background: var(--bg); overflow: hidden; }
  body { font-family: 'IBM Plex Sans Thai', 'Inter', sans-serif; color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); width: 2500px; height: 843px; }
  .cell { padding: 22px; }
  .tile {
    position: relative; height: 100%; border-radius: 52px; background: var(--panel);
    border: 3px solid var(--line); display: flex; align-items: center; gap: 46px; padding: 0 64px;
  }
  .icon {
    flex: none; width: 168px; height: 168px; border-radius: 44px; background: var(--accentSoft);
    display: grid; place-items: center;
  }
  .icon svg { width: 96px; height: 96px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .th { font-weight: 700; font-size: 92px; line-height: 1.12; letter-spacing: -0.5px; white-space: nowrap; }
  .en { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 42px; color: var(--muted); margin-top: 10px; letter-spacing: 0.5px; }
  .th.small { font-size: 78px; }

  /* gradient hero tile, like the dashboard's KPI hero */
  .hero { background: linear-gradient(135deg, var(--heroA), var(--heroB)); border-color: transparent; }
  .hero .th { color: var(--onAccent); }
  .hero .en { color: rgba(12, 23, 21, .66); }
  .hero .icon { background: rgba(12, 23, 21, .12); }
  .hero .icon svg { stroke: var(--onAccent); }
  .brand {
    position: absolute; top: 34px; right: 44px; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 34px;
    letter-spacing: 6px; color: rgba(12, 23, 21, .55);
  }
</style>
</head>
<body>
<div class="grid">
  <!-- งานฉัน -->
  <div class="cell"><div class="tile hero">
    <span class="brand">NORSE</span>
    <div class="icon"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17"/></svg></div>
    <div><div class="th">งานฉัน</div><div class="en">My tasks</div></div>
  </div></div>
  <!-- วันนี้ทำอะไรดี -->
  <div class="cell"><div class="tile">
    <div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></div>
    <div><div class="th small">วันนี้ทำอะไรดี</div><div class="en">Today</div></div>
  </div></div>
  <!-- งานทีม -->
  <div class="cell"><div class="tile">
    <div class="icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16.5 14.2c2.6.3 4.5 2.6 4.5 5.3"/></svg></div>
    <div><div class="th">งานทีม</div><div class="en">Team</div></div>
  </div></div>
  <!-- เพิ่มงาน -->
  <div class="cell"><div class="tile">
    <div class="icon"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M12 8v8M8 12h8"/></svg></div>
    <div><div class="th">เพิ่มงาน</div><div class="en">New task</div></div>
  </div></div>
  <!-- ตั้งค่า -->
  <div class="cell"><div class="tile">
    <div class="icon"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>
    <div><div class="th">ตั้งค่า</div><div class="en">AI &amp; pushes</div></div>
  </div></div>
  <!-- วิธีใช้ (menu.png) / แดชบอร์ด (menu-board.png, when the page is opened with #board) -->
  <div class="cell help-tile"><div class="tile">
    <div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.8"/><path d="M12 17.2h.01"/></svg></div>
    <div><div class="th">วิธีใช้</div><div class="en">Help</div></div>
  </div></div>
</div>
<template id="board-tile">
  <div class="tile">
    <div class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="9" rx="2"/><rect x="13.5" y="3" width="7.5" height="5" rx="2"/><rect x="13.5" y="11" width="7.5" height="10" rx="2"/><rect x="3" y="15" width="7.5" height="6" rx="2"/></svg></div>
    <div><div class="th">แดชบอร์ด</div><div class="en">Dashboard ↗</div></div>
  </div>
</template>
<script>
  if (location.hash === '#board') document.querySelector('.help-tile').replaceChildren(document.getElementById('board-tile').content.cloneNode(true));
</script>
</body>
</html>
